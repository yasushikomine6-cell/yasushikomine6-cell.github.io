<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トリオの女神 | YumeGAMEs.lab</title>
<style>
    body {
        background-color: #121212;
        color: #ddd;
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    .main-container {
        border: 2px solid cyan;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    .header {
        color: magenta;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
    }
    .manga-account-section {
        border: 2px solid yellow;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
        box-shadow: 0 0 8px rgba(255, 255, 0, 0.4);
    }
    .manga-title-label {
        background-color: magenta;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        display: inline-block;
        margin-bottom: 10px;
    }
    .title-display {
        background-color: black;
        border: 1px solid limegreen;
        padding: 10px;
        color: limegreen;
        font-family: monospace;
        font-size: 1.1em;
    }
    cite.manga-title {
        font-style: italic; /* <cite> の標準スタイル */
        display: block;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="main-container">
    <div class="header">夢GAMES. lab</div>
    
    <p>Welcome to YumeGAMEs.lab!</p>

    <div class="manga-account-section">
        <div class="manga-title-label">漫画タイトル</div>
        <div class="title-display">
            <!-- ユーザーの要望通り、citeタグを使用してタイトルを表示します。 -->
            <cite class="manga-title">トリオの女神</cite>
        </div>
        
        <!-- 以下は元の画像からの構造プレースホルダー -->
        <p style="margin-top: 10px;">@dream_games2023</p>
    </div>

</div>

</body>
</html>
