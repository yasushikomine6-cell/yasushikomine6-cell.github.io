<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆいのブログじゃよ！</title>
  <style>
    /* ==============================================
       全体デザイン（レトロ紙・日記帳風）
       ============================================== */
    :root {
      --paper-bg: #fbf7ef;
      --paper-line: #e3d3ba;
      --paper-shadow: rgba(80, 60, 40, 0.15);
      --ink-color: #3a2e2b;
      --accent-color: #a63a3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px 10px;
      background-color: #e8ded1;
      background-image: 
        radial-gradient(#d3c2af 15%, transparent 16%),
        radial-gradient(#d3c2af 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      color: var(--ink-color);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--paper-bg);
      border-radius: 4px;
      padding: 20px 15px;
      box-shadow: 
        0 1px 1px rgba(0,0,0,0.15), 
        0 10px 0 -5px #f4ebd9, 
        0 10px 1px -4px rgba(0,0,0,0.15), 
        0 20px 0 -10px #ebdcc4, 
        0 20px 1px -9px rgba(0,0,0,0.15);
      border: 1px solid #e0d0b8;
      position: relative;
    }

    header {
      text-align: center;
      border-bottom: 2px dashed var(--paper-line);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .author-badge {
      font-size: 0.85rem;
      background: #f0e2cd;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    /* ==============================================
       日記帳背景のプルダウン（1記事〜最新）
       ============================================== */
    .dropdown-section {
      margin-bottom: 20px;
      text-align: center;
    }

    .dropdown-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .journal-select {
      width: 100%;
      max-width: 400px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink-color);
      /* 日記帳の罫線・紙背景設定 */
      background-color: #fbf5e8;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 23px,
        #e3d0b5 24px,
        #e3d0b5 25px
      );
      background-size: 100% 25px;
      border: 2px solid #b8a083;
      border-radius: 6px;
      box-shadow: inset 0 2px 4px var(--paper-shadow);
      cursor: pointer;
      outline: none;
    }

    .journal-select option {
      background: #fbf5e8;
      color: var(--ink-color);
      padding: 8px;
    }

    /* ==============================================
       リアル紙カレンダーデザイン
       ============================================== */
    .calendar-container {
      background: #f7eedd;
      border: 1px solid #d8c3a5;
      padding: 15px 10px;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }

    .calendar-header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #5c4333;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .day-name {
      font-weight: bold;
      font-size: 0.8rem;
      padding-bottom: 4px;
      color: #8c7355;
    }

    .calendar-day {
      background: #fffefb;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #e8dec8;
      border-radius: 4px;
      font-size: 0.85rem;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.05);
      position: relative;
    }

    /* 記事が存在するカレンダーマス */
    .calendar-day.has-post {
      background: #fcefe6;
      border: 2px solid var(--accent-color);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .calendar-day.has-post:hover {
      transform: translateY(-2px);
      box-shadow: 2px 4px 8px var(--paper-shadow);
    }

    .calendar-day.has-post::after {
      content: "📝";
      font-size: 0.7rem;
      margin-top: 1px;
    }

    /* ==============================================
       紙風モーダル（記事表示ウィンドウ）
       ============================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-paper {
      background: var(--paper-bg);
      width: 100%;
      max-width: 500px;
      padding: 25px 20px;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #d8c3a5;
      position: relative;
      /* ノート風の罫線背景 */
      background-image: repeating-linear-gradient(
        transparent,
        transparent 27px,
        #e3d0b5 28px,
        #e3d0b5 29px
      );
      line-height: 29px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 1.8rem;
      cursor: pointer;
      color: #8c7355;
      border: none;
      background: none;
      padding: 0 5px;
      line-height: 1;
    }

    .post-date {
      font-size: 0.8rem;
      color: #8c7355;
      margin-bottom: 5px;
    }

    .post-title {
      font-size: 1.25rem;
      color: var(--accent-color);
      margin: 0 0 12px 0;
      border-bottom: 1px solid var(--accent-color);
      word-break: break-all;
    }

    /* 記事画像のスタイル（角丸5.5px指定） */
    .post-image {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: cover;
      border-radius: 5.5px;
      margin: 10px 0 15px 0;
      border: 1px solid #d8c3a5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: block;
    }

    .post-content {
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-author {
      text-align: right;
      margin-top: 15px;
      font-style: italic;
      color: #665544;
      font-size: 0.9rem;
    }

    /* ==============================================
       レスポンシブ（PC・タブレット表示調整）
       ============================================== */
    @media (min-width: 600px) {
      body {
        padding: 20px;
      }
      .container {
        padding: 30px;
      }
      header h1 {
        font-size: 2rem;
      }
      .calendar-container {
        padding: 20px;
      }
      .calendar-grid {
        gap: 6px;
      }
      .calendar-day {
        font-size: 0.9rem;
      }
      .calendar-day.has-post::after {
        font-size: 0.75rem;
      }
      .modal-paper {
        padding: 30px;
      }
      .post-title {
        font-size: 1.4rem;
      }
      .post-content {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="blog-title">ゆいのブログじゃよ！</h1>
    <span class="author-badge">作者: <span id="blog-author">ゆい</span></span>
  </header>

  <!-- 日記帳風プルダウンリスト -->
  <div class="dropdown-section">
    <label for="postSelect">📖 記事を選択（1記事〜最新）</label>
    <select id="postSelect" class="journal-select" onchange="selectPostFromDropdown(this.value)">
      <option value="">-- 日記のページをめくる --</option>
      <!-- JavaScriptで動的生成 -->
    </select>
  </div>

  <!-- 紙デザイン リアルカレンダー -->
  <div class="calendar-container">
    <div class="calendar-header">📅 2026年 8月</div>
    <div class="calendar-grid">
      <div class="day-name" style="color:#c0392b;">日</div>
      <div class="day-name">月</div>
      <div class="day-name">火</div>
      <div class="day-name">水</div>
      <div class="day-name">木</div>
      <div class="day-name">金</div>
      <div class="day-name" style="color:#2980b9;">土</div>

      <!-- 2026年8月1日（土曜日始まり） -->
      <div></div><div></div><div></div><div></div><div></div><div></div>
      
      <!-- 8月1日（第1話） -->
      <div class="calendar-day has-post" onclick="openModal(0)">1</div>
      <!-- 2日〜3日 -->
      <div class="calendar-day">2</div>
      <div class="calendar-day">3</div>
      <!-- 8月4日（第2話） -->
      <div class="calendar-day has-post" onclick="openModal(1)">4</div>
      <!-- 5日〜31日 -->
      <div class="calendar-day">5</div>
      <div class="calendar-day">6</div>
      <div class="calendar-day">7</div>
      <div class="calendar-day">8</div>
      <div class="calendar-day">9</div>
      <div class="calendar-day">10</div>
      <div class="calendar-day">11</div>
      <div class="calendar-day">12</div>
      <div class="calendar-day">13</div>
      <div class="calendar-day">14</div>
      <div class="calendar-day">15</div>
      <div class="calendar-day">16</div>
      <div class="calendar-day">17</div>
      <div class="calendar-day">18</div>
      <div class="calendar-day">19</div>
      <div class="calendar-day">20</div>
      <div class="calendar-day">21</div>
      <div class="calendar-day">22</div>
      <div class="calendar-day">23</div>
      <div class="calendar-day">24</div>
      <div class="calendar-day">25</div>
      <div class="calendar-day">26</div>
      <div class="calendar-day">27</div>
      <div class="calendar-day">28</div>
      <div class="calendar-day">29</div>
      <div class="calendar-day">30</div>
      <div class="calendar-day">31</div>
    </div>
  </div>
</div>

<!-- 記事閲覧用ポップアップ（紙ダイアログ） -->
<div id="postModal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-paper">
    <button class="modal-close" onclick="closeModalDirect()">&times;</button>
    <div id="modalDate" class="post-date"></div>
    <h2 id="modalTitle" class="post-title"></h2>
    <div id="modalImageContainer"></div>
    <div id="modalContent" class="post-content"></div>
    <div id="modalAuthor" class="post-author"></div>
  </div>
</div>

<script>
  // ブログデータ配列
  const posts = [
    {
      _id: "post_1",
      title: "ゆいのブログじゃよ！",
      content: "今日からブログ始めるけぇ、みんな見ていってね！",
      author: "ゆい",
      created_at: "2026-08-01T21:29:00Z",
      formatted_date: "2026年8月1日"
    },
    {
      _id: "post_2",
      title: "ビヤホールに行ったんじゃ",
      content: "ビヤホールに行ったんじゃ",
      image_url: "https://yasushikomine6-cell.github.io/1785791535272.png",
      author: "ゆい",
      created_at: "2026-08-04T12:00:00Z",
      formatted_date: "2026年8月4日"
    }
  ];

  // プルダウン初期化
  const selectEl = document.getElementById('postSelect');
  posts.forEach((post, index) => {
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = `第${index + 1}話: ${post.title} (${post.formatted_date.replace(/(\d{4})年(\d{1,2})月(\d{1,2})日/, '$1/$2/$3')})`;
    selectEl.appendChild(opt);
  });

  // 紙ダイアログを開く処理
  function openModal(index) {
    const post = posts[index];
    if (!post) return;

    document.getElementById('modalDate').innerText = post.formatted_date;
    document.getElementById('modalTitle').innerText = post.title;
    
    // 画像の表示処理
    const imgContainer = document.getElementById('modalImageContainer');
    if (post.image_url) {
      imgContainer.innerHTML = `<img src="${post.image_url}" alt="日記画像" class="post-image">`;
    } else {
      imgContainer.innerHTML = '';
    }

    document.getElementById('modalContent').innerText = post.content;
    document.getElementById('modalAuthor').innerText = `筆者: ${post.author}`;

    document.getElementById('postModal').style.display = 'flex';
  }

  // プルダウン変更時
  function selectPostFromDropdown(val) {
    if (val !== "") {
      openModal(parseInt(val));
    }
  }

  // モーダル閉じる
  function closeModal(e) {
    if (e.target.id === 'postModal') {
      document.getElementById('postModal').style.display = 'none';
    }
  }
  function closeModalDirect() {
    document.getElementById('postModal').style.display = 'none';
  }
</script>


<div class="search-container">
  <form action="#" method="get" class="search-form">
    <input type="text" name="q" placeholder="キーワードを入力..." class="search-input" />
    <button type="submit" class="search-button">検索</button>
  </form>
</div>


</body>
</html>
