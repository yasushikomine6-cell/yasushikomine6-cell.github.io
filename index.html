<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢GAMEs.lab - Flash Nostalgia</title>
  <style>
    /* 全体リセット & Flash風ダークテーマ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace, "MS Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px; /* スマホ向けに余白を縮小 */
    }

    /* Flashコンテンツ枠（スマホ画面一杯にフィットするよう調整） */
    .flash-container {
      width: 100%;
      max-width: 380px; /* スマホにちょうど良い幅に指定 */
      background: #11161d;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      padding: 20px 16px; /* パディングをスマホ用に最適化 */
      border-radius: 8px;
    }

    /* サイトタイトル */
    .site-title {
      font-size: 1.25rem; /* スマホで見やすいサイズに調整 */
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
      margin-bottom: 16px;
      border-bottom: 1px dashed #ff0055;
      padding-bottom: 8px;
      text-align: center; /* スマホでバランスが取れるよう中央揃え */
    }

    /* タイプライター演出コンテナ */
    .typewriter-wrapper {
      display: flex;
      justify-content: center; /* タイピング文字を中央寄りに配置 */
      width: 100%;
      overflow: hidden;
    }

    /* タイプライター効果のCSS */
    .typewriter-text {
      font-size: 0.9rem; /* スマホで1行に収まるようサイズ調整 */
      line-height: 1.6;
      color: #00ffcc;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #00ffcc;
      
      /* 24文字分を2.4秒で表示 */
      animation: 
        typing 2.4s steps(24, end) forwards,
        blink-caret 0.75s step-end infinite;
    }

    /* 文字が左から右へ現れるキーフレーム */
    @keyframes typing {
      from { width: 0; }
      to { width: 24ch; }
    }

    /* カーソルの点滅キーフレーム */
    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #00ffcc; }
    }

    /* メニューリンク群 */
    .menu-list {
      margin-top: 24px;
      list-style: none;
    }
    .menu-list li {
      margin-bottom: 10px;
    }
    .menu-list a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: block; /* タップしやすいよう領域を広く */
      padding: 8px 12px;
      background: rgba(0, 255, 204, 0.05); /* タップ領域の視認性をUP */
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 4px;
    }
    .menu-list a:hover,
    .menu-list a:active { /* スマホのタップ時（active）にも反応するよう追加 */
      color: #00ffcc;
      background: rgba(0, 255, 204, 0.15);
      border-color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }
  </style>
</head>
<body>

  <div class="flash-container">
    <div class="site-title">夢GAMEs.lab</div>

    <!-- タイプライター演出部分 -->
    <div class="typewriter-wrapper">
      <p class="typewriter-text">Welcome to YumeGAMEs.lab...</p>
    </div>

    <!-- Flashサイト風メニュー -->
    <ul class="menu-list">
      <li><a href="#">▶ ENTER GAME LAB</a></li>
      <li><a href="#">▶ FLASH ARCHIVE</a></li>
      <li><a href="#">▶ ABOUT US</a></li>
    </ul>
  </div>

</body>
</html>
