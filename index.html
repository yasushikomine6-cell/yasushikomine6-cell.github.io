<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢GAMEs.lab - Mobile view</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap');

    :root {
      --bg-color: #0d0f12;
      --card-bg: #11161d;
      --neon-cyan: #00ffcc;
      --neon-pink: #ff0055;
      --neon-green: #39ff14;
      --sub-cyan: #00e5ff;
      --neon-yellow: #ffea00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: var(--neon-cyan);
      font-family: 'DotGothic16', 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
    }

    /* スマホ画面風コンテナ (最大幅 390px) */
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      background-color: var(--bg-color);
      border: 2px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px; /* 下段に向かって整列する間隔 */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* -----------------------------------
       1. 上段: Flash風メインカード & アニメーション
    ----------------------------------- */
    .flash-container {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
      padding: 16px;
      border-radius: 8px;
    }

    /* ハンバーガーアイコン (チェックボックス式) */
    #menu-toggle {
      display: none;
    }
    .hamburger-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 26px;
      height: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 10;
    }
    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: var(--neon-cyan);
      box-shadow: 0 0 4px var(--neon-cyan);
      transition: all 0.3s ease;
    }

    /* ハンバーガーアニメーション */
    #menu-toggle:checked + .hamburger-btn span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }
    #menu-toggle:checked + .hamburger-btn span:nth-child(2) {
      opacity: 0;
    }
    #menu-toggle:checked + .hamburger-btn span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }

    .site-title {
      font-size: 1.2rem;
      color: var(--neon-pink);
      text-shadow: 0 0 6px var(--neon-pink);
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--neon-pink);
      padding-bottom: 6px;
      padding-right: 36px;
    }

    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    .typewriter-text {
      font-size: 0.85rem;
      color: var(--neon-cyan);
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid var(--neon-cyan);
      animation: 
        typing 2.4s steps(24, end) forwards,
        blink-caret 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 24ch; }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--neon-cyan); }
    }

    /* アコーディオンメニュー */
    .menu-list {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      list-style: none;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
      margin-top: 0;
    }
    #menu-toggle:checked ~ .menu-list {
      max-height: 200px;
      opacity: 1;
      margin-top: 16px;
    }
    .menu-list li {
      margin-bottom: 8px;
    }
    .menu-list a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      display: block;
      padding: 8px 10px;
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 4px;
    }
    .menu-list a:hover {
      color: var(--neon-cyan);
      background: rgba(0, 255, 204, 0.15);
      border-color: var(--neon-cyan);
    }

    /* -----------------------------------
       2. 中段: スライドイン側メニュー (ドロワー)
    ----------------------------------- */
    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100vh;
      background-color: #15181c;
      border-right: 1px solid #2f3336;
      padding: 20px 16px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1001;
    }
    #drawer-toggle {
      display: none;
    }
    #drawer-toggle:checked ~ .drawer {
      left: 0;
    }
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }
    #drawer-toggle:checked ~ .drawer-overlay {
      opacity: 1;
      visibility: visible;
    }

    .drawer-open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: #1e2732;
      border: 1px solid #2f3336;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn::before, .close-btn::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 2px;
      background-color: #fff;
    }
    .close-btn::before { transform: rotate(45deg); }
    .close-btn::after { transform: rotate(-45deg); }

    /* ドロワー内部のアカウント表示 */
    .drawer-account-card {
      margin-top: 40px;
      background: #0d0f12;
      border: 1px solid #2f3336;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* -----------------------------------
       3. 下段: ゲーム屋風 X リンクカード (共通)
    ----------------------------------- */
    .game-card {
      background: #151a21;
      padding: 20px 16px 16px;
      text-align: center;
      position: relative;
      border-radius: 4px;
    }

    /* 漫画アカウント用スタイル (黄色・ピンク系ネオン) */
    .manga-card {
      border: 3px solid var(--neon-yellow);
      box-shadow: 0 0 10px rgba(255, 234, 0, 0.3);
    }
    .manga-badge {
      background-color: #ff007f;
      box-shadow: 0 0 6px #ff007f;
    }

    /* ゲームアカウント用スタイル (グリーン系ネオン) */
    .game-acc-card {
      border: 3px solid var(--neon-green);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
    }
    .game-acc-badge {
      background-color: var(--neon-pink);
      box-shadow: 0 0 6px var(--neon-pink);
    }

    .game-title-badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      padding: 2px 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ドット絵風 CSS X マーク */
    .pixel-x-container {
      margin: 10px auto 12px;
      width: 64px;
      height: 64px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 1px;
      padding: 4px;
      background: #000;
      border: 2px solid var(--sub-cyan);
      box-shadow: 0 0 6px var(--sub-cyan);
    }
    .pixel { background-color: transparent; }
    .pixel.on { background-color: #ffffff; }

    .account-info {
      margin-bottom: 14px;
    }
    .account-label {
      color: var(--sub-cyan);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }
    .account-id {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      color: #fff;
      word-break: break-all;
    }

    /* ゲーム風アクションボタン */
    .game-btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      border: 2px solid #fff;
      box-sizing: border-box;
      transition: transform 0.1s;
    }
    .manga-btn {
      background: linear-gradient(135deg, #ff007f, #b000ff);
      box-shadow: 3px 3px 0px var(--neon-yellow);
    }
    .manga-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--neon-yellow);
    }
    
    .game-acc-btn {
      background: linear-gradient(135deg, var(--neon-pink), #b000ff);
      box-shadow: 3px 3px 0px var(--neon-green);
    }
    .game-acc-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--neon-green);
    }
  </style>
</head>
