<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢GAMEs.Lab - 公式ナビゲーション</title>
  <style>
    /* 全体・レスポンシブコンテナ */
    .yume-lab-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 12px;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #333;
    }

    /* ラップカード */
    .yume-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 180, 216, 0.15);
      border: 1px solid #e0f2fe;
      overflow: hidden;
      margin-bottom: 24px;
    }

    /* ヘッダーデザイン */
    .yume-card-header {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .yume-card-header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yume-card-header .badge {
      background: rgba(255, 255, 255, 0.25);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* テーブル基本スタイル */
    .yume-table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .yume-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    .yume-table th {
      background-color: #f0f9ff;
      color: #0369a1;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 2px solid #bae6fd;
      white-space: nowrap;
    }

    .yume-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.2s ease;
    }

    .yume-table tbody tr:hover {
      background-color: #f8fafc;
    }

    .yume-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* リンクボタン風スタイリング */
    .yume-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
      transition: all 0.2s ease-in-out;
      white-space: nowrap;
    }

    .yume-btn:hover {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transform: translateY(-1px);
    }

    /* スマホ画面向けの可変最適化（576px以下） */
    @media (max-width: 576px) {
      .yume-card-header {
        padding: 14px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .yume-table th, 
      .yume-table td {
        padding: 10px 12px;
        font-size: 0.88rem;
      }

      .yume-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<div class="yume-lab-container">

  <!-- 公式ポータル & キャラクターリンクテーブル -->
  <div class="yume-card">
    <div class="yume-card-header">

    <div class="yume-table-wrapper">

            <th>ページ名</th>

          </tr>
        </thead>
        <tbody>

          <tr>

            <td style="text-align: right;">

            </td>
          </tr>
          <tr>
            <td><strong>ブログ</strong></td>
            <td>最新情報・記事一覧</td>
            <td style="text-align: right;">
              <a href="https://yasushikomine6-cell.github.io/blog" class="yume-btn" target="_blank" rel="noopener">閲覧する ➔</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
