<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢GAMEs.lab - Flash Nostalgia</title>
  <style>
    /* 全体リセット & Flash風ダークテーマ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace, "MS Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* Flashコンテンツ枠 */
    .flash-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: #11161d;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      padding: 20px 16px;
      border-radius: 8px;
      overflow: hidden;
    }

    /* ハンバーガーアイコン（チェックボックスハック） */
    #menu-toggle {
      display: none;
    }
    .hamburger-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 100;
    }
    .hamburger-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #00ffcc;
      box-shadow: 0 0 5px #00ffcc;
      transition: all 0.3s ease;
    }

    /* ハンバーガーアニメーション (開いた時) */
    #menu-toggle:checked + .hamburger-btn span:nth-child(1) {
      transform: translateY(10.5px) rotate(45deg);
    }
    #menu-toggle:checked + .hamburger-btn span:nth-child(2) {
      opacity: 0;
    }
    #menu-toggle:checked + .hamburger-btn span:nth-child(3) {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* サイトタイトル */
    .site-title {
      font-size: 1.25rem;
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
      margin-bottom: 16px;
      border-bottom: 1px dashed #ff0055;
      padding-bottom: 8px;
      text-align: left;
      padding-right: 40px; /* アイコン被り防止 */
    }

    /* タイプライター演出コンテナ */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    /* タイプライター効果のCSS */
    .typewriter-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #00ffcc;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #00ffcc;
      animation: 
        typing 2.4s steps(24, end) forwards,
        blink-caret 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 24ch; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #00ffcc; }
    }

    /* ハンバーガーメニュー（初期状態は非表示） */
    .menu-list {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      list-style: none;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
      margin-top: 0;
    }

    /* チェック時にメニュー展開 */
    #menu-toggle:checked ~ .menu-list {
      max-height: 200px;
      opacity: 1;
      margin-top: 20px;
    }

    .menu-list li {
      margin-bottom: 8px;
    }
    .menu-list a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: block;
      padding: 10px 12px;
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 4px;
    }
    .menu-list a:hover,
    .menu-list a:active {
      color: #00ffcc;
      background: rgba(0, 255, 204, 0.15);
      border-color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc;
    }
  </style>
</head>
<body>

  <div class="flash-container">
    <!-- ハンバーガー開閉用のチェックボックス -->
    <input type="checkbox" id="menu-toggle">
    
    <!-- ハンバーガーボタン -->
    <label for="menu-toggle" class="hamburger-btn">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <div class="site-title">夢GAMEs.lab</div>

    <!-- タイプライター演出部分 -->
    <div class="typewriter-wrapper">
      <p class="typewriter-text">Welcome to YumeGAMEs.lab...</p>
    </div>

    <!-- ハンバーガー展開メニュー -->
    <ul class="menu-list">
      <li><a href="#">▶ 個人事業主概要</a></li>
      <li><a href="#">▶ この屋号は？</a></li>
      <li><a href="#">▶ 漫画連載</a></li>
    </ul>
  </div>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲームアカウント - 左メニュー</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* 1. 左側ハンバーガーボタン */
    .menu-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      z-index: 1000;
      transition: background 0.2s ease;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .menu-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background-color: #fff;
      border-radius: 2px;
    }

    /* チェックボックスでメニュー開閉状態を切り替え */
    #menu-toggle {
      display: none;
    }

    /* 2. ドロワーメニュー (左側からスライドイン) */
    .drawer {
      position: fixed;
      top: 0;
      left: -300px; /* 初期状態は画面外 */
      width: 280px;
      height: 100vh;
      background-color: #15181c;
      border-right: 1px solid #2f3336;
      padding: 20px;
      box-sizing: border-box;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1001;
    }

    /* チェックボックスが入ったらメニューを表示 */
    #menu-toggle:checked ~ .drawer {
      left: 0;
    }

    /* 背景のオーバーレイ */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 999;
    }
    #menu-toggle:checked ~ .overlay {
      opacity: 1;
      visibility: visible;
    }

    /* 3. CSSでつくる「閉じる (X) マーク」 */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    /* CSSによるX線の描画 */
    .close-btn::before,
    .close-btn::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 2px;
      background-color: #e7e9ea;
      border-radius: 1px;
    }
    .close-btn::before {
      transform: rotate(45deg);
    }
    .close-btn::after {
      transform: rotate(-45deg);
    }

    /* 4. ゲームアカウント情報カード */
    .account-card {
      margin-top: 50px;
      background: #1e2732;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Xマークのアイコン（ロゴ風CSS） */
    .x-logo-icon {
      width: 40px;
      height: 40px;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .x-logo-icon::before,
    .x-logo-icon::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 3px;
      background-color: #fff;
    }
    .x-logo-icon::before {
      transform: rotate(45deg);
    }
    .x-logo-icon::after {
      transform: rotate(-45deg);
    }

    .profile-info .name {
      font-weight: bold;
      font-size: 1rem;
      color: #fff;
    }
    .profile-info .handle {
      font-size: 0.85rem;
      color: #71767b;
    }

    .game-stats {
      border-top: 1px solid #2f3336;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #71767b;
    }
    .game-stats span strong {
      color: #fff;
    }

    .account-link {
      display: inline-block;
      text-align: center;
      background-color: #1d9bf0;
      color: #fff;
      padding: 8px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .account-link:hover {
      background-color: #1a8cd8;
    }
  </style>
</head>
<body>

  <!-- メニュー開閉用チェックボックス -->
  <input type="checkbox" id="menu-toggle">

  <!-- 画面左上のハンバーガーボタン -->
  <label for="menu-toggle" class="menu-btn" aria-label="Open Menu">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <!-- 背景暗転用オーバーレイ -->
  <label for="menu-toggle" class="overlay"></label>

  <!-- 左側スライドインメニュー -->
  <aside class="drawer">
    <!-- メニュー内の閉じるXボタン -->
    <label for="menu-toggle" class="close-btn" aria-label="Close Menu"></label>

    <!-- ゲームアカウント情報 -->
    <div class="account-card">
      <div class="profile-header">
        <div class="x-logo-icon"></div>
        <div class="profile-info">
          <div class="name">Yasushi Komine</div>
          <div class="handle">@yasushi_komineg</div>
        </div>
      </div>

      <div class="game-stats">
        <span><strong>Game Account</strong></span>
        <span>Active</span>
      </div>

      <a href="https://x.com/yasushi_komineg" target="_blank" rel="noopener noreferrer" class="account-link">
        X (Twitter) プロフィール
      </a>
    </div>
  </aside>

</body>
</html>
