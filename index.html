<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢GAMEs.Lab - Title Flash</title>
  <style>
    :root {
      --mitaka-green: #008753;       /* 三鷹市シンボルカラー */
      --mitaka-green-light: #22c55e; /* エメラルドグリーン */
      --mitaka-green-glow: rgba(34, 197, 94, 0.4);
      --gl-bg: #0a0f0d;
    }

    body {
      background-color: var(--gl-bg);
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* --- ルパン三世風 タイトルフラッシュ --- */
    .site-header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lupin-flash-box {
      background-color: #000000;
      padding: 16px 48px;
      border: 2px solid var(--mitaka-green-light);
      box-shadow: 0 0 20px var(--mitaka-green-glow);
      animation: lupinFlashBg 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    .site-title.lupin-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #fffde7; /* ルパン風の黄色みがかった白 */
      letter-spacing: 6px;
      text-align: center;
      margin: 0;
      text-shadow: 2px 2px 0px #000, 0 0 12px rgba(255, 255, 255, 0.8);
      animation: lupinTypewriter 0.2s ease-out forwards;
    }

    /* フラッシュ効果アニメーション */
    @keyframes lupinFlashBg {
      0% {
        background-color: #ffffff;
        box-shadow: 0 0 60px #ffffff;
      }
      50% {
        background-color: var(--mitaka-green);
      }
      100% {
        background-color: #000000;
      }
    }

    @keyframes lupinTypewriter {
      0% {
        opacity: 0;
        transform: scale(1.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media screen and (max-width: 600px) {
      .lupin-flash-box {
        padding: 12px 24px;
      }
      .site-title.lupin-title {
        font-size: 1.6rem;
        letter-spacing: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- 屋号名・サイトタイトル（ルパン風フラッシュ演出） -->
  <div class="site-header">
    <div class="lupin-flash-box">
      <h1 class="site-title lupin-title">夢GAMEs.Lab</h1>
    </div>
  </div>

</body>
</html>
