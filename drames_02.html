<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人事業主┃夢GAMEs.Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全体設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #00ffff;
      font-family: 'DotGothic16', sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .container {
      width: 100%;
      max-width: 480px; /* スマホ表示に最適化 */
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ヘッダーカード */
    .header-card {
      border: 2px solid #00ffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px #00ffff;
      background-color: #161b22;
      text-align: center;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #ff007f;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .site-title {
      color: #ff007f;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 0 0 5px #ff007f;
    }
    .menu-icon {
      color: #00ffff;
      font-size: 1.5rem;
    }
    .welcome-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.8rem;
      color: #00ffff;
      margin-top: 5px;
    }

    /* セクションボタン */
    .menu-button {
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #ffffff;
      padding: 12px;
      text-align: center;
      font-size: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* 情報カード：共通スタイル */
    .info-card {
      position: relative;
      background-color: #161b22;
      border-radius: 8px;
      padding: 25px 15px 15px 15px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card-badge {
      position: absolute;
      top: -12px;
      background-color: #ff007f;
      color: #ffffff;
      padding: 2px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 0 5px #ff007f;
    }

    /* イエローフレーム（概要） */
    .card-yellow {
      border: 2px solid #ffff00;
      box-shadow: 0 0 8px #ffff00;
    }

    /* グリーンフレーム（連絡先） */
    .card-green {
      border: 2px solid #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    /* カード内テキスト */
    .info-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      color: #00ffff;
      margin-top: 10px;
    }
    .info-value {
      font-size: 1.1rem;
      color: #ffffff;
      margin: 5px 0 15px 0;
      word-break: break-all;
    }

    /* アクションボタン（ネオンピンク） */
    .action-btn {
      width: 100%;
      background: linear-gradient(180deg, #d800a6 0%, #800055 100%);
      border: 2px solid #ffffff;
      border-radius: 6px;
      color: #ffffff;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 8px #ff007f;
      cursor: pointer;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ヘッダーエリア -->
  <header class="header-card">
    <div class="header-top">
      <div class="site-title">夢GAMEs.Lab</div>
      <div class="menu-icon">☰</div>
    </div>
    <div class="welcome-text">Welcome to YumeGAMEs.lab</div>
  </header>

  <!-- アカウントメニューボタン -->
  <div class="menu-button">
    <span>☰</span> 事業者情報を表示
  </div>

  <!-- カード1：屋号・店長情報（イエロー枠） -->
  <main class="info-card card-yellow">
    <div class="card-badge">事業概要</div>
    
    <div class="info-label">BUSINESS TYPE</div>
    <div class="info-value">個人事業主</div>

    <div class="info-label">OWNER</div>
    <div class="info-value">こみねやすし</div>

    <a href="#" class="action-btn">
      <span>▶</span> 事業者詳細を表示
    </a>
  </main>

  <!-- カード2：拠点・電話番号情報（グリーン枠） -->
  <section class="info-card card-green">
    <div class="card-badge">拠点・連絡先</div>

    <div class="info-label">OFFICE LOCATION</div>
    <div class="info-value">関東広域移動オフィス</div>

    <div class="info-label">PHONE NUMBER</div>
    <div class="info-value">07012500937</div>

    <a href="tel:07012500937" class="action-btn">
      <span>▶</span> 発信・問合せをする
    </a>
  </section>

</div>

</body>
</html>
