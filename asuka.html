<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市原明日香 公式ホームページ</title>
    <style>
        /* カラーコードの定義 */
        :root {
            --primary-color: #007bff; /* 青 */
            --secondary-color: #ffffff; /* 白 */
            --accent-color: #ffc107; /* 黄 */
            --text-color: #333333; /* 黒 */
        }

        /* 全体設定 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        /* ヘッダー */
        header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 20px;
            text-align: center;
        }

        /* メインコンテンツ */
        main {
            padding: 20px;
        }

        /* キャラクター画像 */
        .character-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* 自己紹介 */
        .profile {
            margin-top: 20px;
        }

        /* ニュース */
        .news {
            margin-top: 20px;
        }

        /* フッター */
        footer {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 10px;
            text-align: center;
        }

        /* レスポンシブ対応 (スマホ) */
        @media (max-width: 768px) {
            header {
                padding: 10px;
            }

            main {
                padding: 10px;
            }

            .profile {
                margin-top: 10px;
            }

            .news {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>市原明日香 公式ホームページ</h1>
    </header>

    <main>
        <!-- 指定の画像URLを挿入 -->
        <img src="https://yasushikomine6-cell.github.io/1785499859932.png" alt="市原明日香" class="character-image">

        <div class="profile">
            <h2>自己紹介</h2>
            <p>こんにちは、市原明日香です！</p>
            <p>趣味は歌うことと踊ることです。将来はアイドルまたはダンサーになって、みんなに元気を届けたいです！</p>
        </div>

        <div class="news">
            <h2>ニュース</h2>
            <ul>
                <li>2026年8月1日：公式ホームページがオープンしました！</li>
                <li>2026年2月1日：新曲「夢に向かって」をリリースしました！</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 市原明日香 公式ホームページ</p>
    </footer>
</body>
</html>
